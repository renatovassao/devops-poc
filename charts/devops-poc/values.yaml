replicaCount: 1

image:
  repository: ghcr.io/renatovassao/devops-poc
  pullPolicy: IfNotPresent
  tag: "main"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  hosts:
    - paths:
        - path: /
          pathType: Prefix

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http